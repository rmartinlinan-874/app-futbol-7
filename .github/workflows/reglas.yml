name: Desplegar reglas de Firestore

# Cuando cambian las reglas de seguridad (firestore.rules), las sube al
# proyecto Firebase con la misma cuenta de servicio que usan los avisos.
on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "scripts/desplegar-reglas.mjs"
  workflow_dispatch:

concurrency:
  group: reglas
  cancel-in-progress: false

jobs:
  reglas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: node scripts/desplegar-reglas.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
