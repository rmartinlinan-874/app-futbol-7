name: Notificaciones

on:
  schedule:
    # Cada 30 minutos. El propio script decide si "toca" avisar o no.
    - cron: "0,30 * * * *"
  workflow_dispatch:
    inputs:
      penista_prueba:
        description: "Nombre exacto de un peñista para enviarle solo a él un aviso de prueba (deja en blanco para la comprobación normal)"
        required: false
        default: ""

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: node scripts/notificaciones.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PENISTA_PRUEBA: ${{ github.event.inputs.penista_prueba }}
